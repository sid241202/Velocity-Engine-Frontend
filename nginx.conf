server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config: a fixed filename (not content-hashed like the bundled
    # assets below), so it can change across deployments/environments
    # without the filename changing. It must not be cached for a year like
    # the hashed build assets, or a redeployed client_id/authority/
    # redirect_uri won't reach returning browsers until the stale cached
    # copy expires (WAS 150249 flagged its old max-age=31536000).
    location = /env-config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
    }

    # Legacy Flash cross-domain policy probe: this app ships no Flash
    # content and no such file. Left unhandled, it falls through to the SPA
    # catch-all below and returns 200 with the index.html shell mislabeled
    # as XML (WAS 150106 / 150789).
    location = /crossdomain.xml {
        return 404;
    }

    # Real asset filenames are always content-hashed by the Vite build,
    # so an unmatched path under /assets/ is never a real file and must
    # 404 rather than fall through to the SPA catch-all below, which was
    # returning 200 with the index.html shell for any path and got flagged
    # as a discoverable resource (WAS 150004 Predictable Resource Location
    # Via Forced Browsing).
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://velocity-backend-svc:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 15-minute timeout: supports long-running DuckDB historical replay
        # and ClickHouse aggregation scans without 502 Gateway Timeout.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 10s;
        # The backend already sets its own copies of these same security
        # headers. Without hiding them here, the server-level add_header
        # directives above append a second copy on top of the backend's,
        # producing duplicate/malformed response headers (e.g. two
        # Content-Security-Policy lines that get merged into one
        # comma-joined value) that WAS flagged as misconfigured even though
        # the effective policy was fine (150203, 150207, 150245).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        # This frontend only ever calls /api/* same-origin — browsers don't
        # consult CORS headers for same-origin requests at all, so hiding
        # the backend's blanket Access-Control-Allow-Origin: * here has no
        # effect on this app and closes off cross-origin browser reads of
        # these endpoints from any other site (WAS 150630).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location /api/ws/ {
        proxy_pass http://velocity-backend-svc:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does not merge add_header directives across levels: once a
        # location block declares any add_header of its own, none of the
        # server-level ones apply here — they must be repeated. This block
        # previously omitted CSP and Permissions-Policy, so every static
        # asset (JS/CSS/icons) shipped without them (2026-07-23 WAS scan).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;
    }
}
