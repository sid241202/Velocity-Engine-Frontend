server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Kubernetes Service DNS (e.g. velocity-backend-svc) is resolved by the
    # cluster's CoreDNS, not baked into the image. A literal (non-variable)
    # proxy_pass target is resolved by nginx exactly once, at worker startup,
    # and never again for the life of the process — if the backend Service
    # wasn't reliably resolvable yet at that instant (pod bring-up order is
    # not guaranteed), every request 502s forever afterward, surviving even
    # a later-healthy backend, until this container itself restarts. The
    # `resolver` directive plus variable-based proxy_pass below (see /api/
    # and /api/ws/) makes nginx re-resolve per request instead, so it keeps
    # picking up the backend once it becomes available and tolerates the
    # Service's ClusterIP or pod IP changing later.
    #
    # This is `include`d from a separate, generated file rather than written
    # directly here because in the deployed cluster this default.conf is
    # itself supplied by a ConfigMap volume mounted with `subPath` (see
    # deployment.yaml) — subPath ConfigMap mounts are always presented
    # read-only inside the container, so docker-entrypoint.sh cannot rewrite
    # this file in place at startup. It instead writes the resolved cluster
    # DNS IP (read from this container's own /etc/resolv.conf — never
    # hardcode an IP here, it differs per cluster/environment) to
    # /etc/nginx/conf.d/resolver.generated.conf, a path the ConfigMap mount
    # doesn't cover, before nginx starts.
    include /etc/nginx/conf.d/resolver.generated.conf;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss: https://sso.uidai.net.in; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config: a fixed filename (not content-hashed like the bundled
    # assets below), so it can change across deployments/environments
    # without the filename changing. It must not be cached for a year like
    # the hashed build assets, or a redeployed client_id/authority/
    # redirect_uri won't reach returning browsers until the stale cached
    # copy expires (WAS 150249 flagged its old max-age=31536000).
    location = /env-config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss: https://sso.uidai.net.in; frame-ancestors 'none';" always;
    }

    # Legacy Flash cross-domain policy probe: this app ships no Flash
    # content and no such file. Left unhandled, it falls through to the SPA
    # catch-all below and returns 200 with the index.html shell mislabeled
    # as XML (WAS 150106 / 150789).
    location = /crossdomain.xml {
        return 404;
    }

    # Real asset filenames are always content-hashed by the Vite build,
    # so an unmatched path under /assets/ is never a real file and must
    # 404 rather than fall through to the SPA catch-all below, which was
    # returning 200 with the index.html shell for any path and got flagged
    # as a discoverable resource (WAS 150004 Predictable Resource Location
    # Via Forced Browsing).
    location /assets/ {
        try_files $uri =404;
    }

    location /api/ {
        # Variable target (not a literal), so the `resolver` directive above
        # re-resolves velocity-backend-svc on every request instead of once
        # at worker startup — see the comment on `resolver` above. nginx
        # only auto-strips a location's matched prefix (the way a literal
        # `proxy_pass http://host:port/;` with a trailing slash does) when
        # the target is a static string known at config-load time; with a
        # variable target that replacement is disabled entirely, so without
        # the rewrite below the backend would receive every request's URI
        # collapsed to just "/". The rewrite reproduces the prefix-strip by
        # hand: backend routes have no /api prefix (see cmd/server/main.go —
        # GET /me, GET /rules, etc.), so /api/me must reach it as /me.
        #
        # Scheme and port stay as literal text in proxy_pass itself, with
        # only the hostname in the variable — an entire proxy_pass target in
        # one variable (e.g. a var holding the full "http://host:port")
        # fails at request time with nginx's "invalid URL prefix" error.
        # `set` must come before `rewrite ... break`, not after: `break`
        # halts processing of the rest of this location's rewrite-module
        # directives, and `set` is a rewrite-module directive too — placed
        # after `break` it silently never runs, leaving the variable empty.
        set $backend_host velocity-backend-svc;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 15-minute timeout: supports long-running DuckDB historical replay
        # and ClickHouse aggregation scans without 502 Gateway Timeout.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 10s;
        # The backend already sets its own copies of these same security
        # headers. Without hiding them here, the server-level add_header
        # directives above append a second copy on top of the backend's,
        # producing duplicate/malformed response headers (e.g. two
        # Content-Security-Policy lines that get merged into one
        # comma-joined value) that WAS flagged as misconfigured even though
        # the effective policy was fine (150203, 150207, 150245).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        # This frontend only ever calls /api/* same-origin — browsers don't
        # consult CORS headers for same-origin requests at all, so hiding
        # the backend's blanket Access-Control-Allow-Origin: * here has no
        # effect on this app and closes off cross-origin browser reads of
        # these endpoints from any other site (WAS 150630).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location /api/ws/ {
        # Same re-resolution reasoning and rewrite-instead-of-URI-suffix
        # workaround as /api/ above (backend's WS routes are /ws/*, not
        # /api/ws/* — see cmd/server/main.go).
        set $backend_host velocity-backend-svc;
        rewrite ^/api/ws/(.*)$ /ws/$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does not merge add_header directives across levels: once a
        # location block declares any add_header of its own, none of the
        # server-level ones apply here — they must be repeated. This block
        # previously omitted CSP and Permissions-Policy, so every static
        # asset (JS/CSS/icons) shipped without them (2026-07-23 WAS scan).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' ws: wss: https://sso.uidai.net.in; frame-ancestors 'none';" always;
    }
}
