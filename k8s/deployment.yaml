apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-frontend
  namespace: velocity-namespace
  labels:
    app: velocity-engine
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity-engine
      component: frontend
  template:
    metadata:
      labels:
        app: velocity-engine
        component: frontend
    spec:
      containers:
      - name: frontend
        image: harbor.example.com/velocity-engine/control-plane-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
